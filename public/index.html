<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.svg" type="image/svg+xml" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <title>Jason Tsao — Portfolio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
    <meta name="description" content="Jason Tsao — Computer Engineering student at SJSU and IT professional. Portfolio showcasing projects, experience, and skills." />
    <meta name="theme-color" content="#0d0d0d" />

    <!-- Stamps <html data-theme> before first paint: a stored choice, else the
         OS preference, else dark. Must stay inline and ahead of the stylesheet
         or the page paints one theme and swaps to the other. -->
    <script>
      (function () {
        var t = 'dark';
        try {
          var saved = localStorage.getItem('theme');
          t = saved === 'light' || saved === 'dark'
            ? saved
            : (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
        } catch (e) { /* storage blocked — fall through to dark */ }
        document.documentElement.setAttribute('data-theme', t);
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute('content', t === 'light' ? '#f7f7f6' : '#0d0d0d');
      })();
    </script>

    <!-- Open Graph / LinkedIn -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Jason Tsao — Portfolio" />
    <meta property="og:description" content="Computer Engineering student at SJSU and IT professional. Projects, experience, and skills." />
    <meta property="og:image" content="https://maaboudoumei.org/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:url" content="https://maaboudoumei.org/" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Jason Tsao — Portfolio" />
    <meta name="twitter:description" content="Computer Engineering student at SJSU and IT professional." />
    <meta name="twitter:image" content="https://maaboudoumei.org/og-image.png" />
  </head>
  <body>

    <div id="root"></div>
  </body>
</html>
